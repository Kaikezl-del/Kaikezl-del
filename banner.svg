<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Banner animado: cavaleiro lutando contra um dragão que cospe fogo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Player One - Kaike Alves Praxedes</title>
  <style>
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100px); } }
    @keyframes hills { from { transform: translateX(0); } to { transform: translateX(-200px); } }
    @keyframes slash { 0%,35% { transform: rotate(-35deg); } 50%,62% { transform: rotate(72deg); } 100% { transform: rotate(-35deg); } }
    @keyframes spark { 0%,46% { opacity: 0; } 50%,60% { opacity: 1; } 68%,100% { opacity: 0; } }
    @keyframes recoil { 0%,46% { transform: translateX(0); } 54% { transform: translateX(7px); } 80%,100% { transform: translateX(0); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes legA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes legB { 0%,100% { transform: translateY(-4px); } 50% { transform: translateY(0); } }
    @keyframes flap { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
    @keyframes flame { 0%,100% { transform: scale(1,1); } 50% { transform: scale(.78,1.2); } }
    @keyframes hp { 0% { transform: scaleX(1); } 85% { transform: scaleX(.08); } 100% { transform: scaleX(1); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-950px); } }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    .scroll { animation: scroll .6s linear infinite; }
    .hills { animation: hills 4s linear infinite; }
    .slash { animation: slash 1.2s ease-in-out infinite; }
    .spark { animation: spark 1.2s linear infinite; }
    .recoil { animation: recoil 1.2s ease-in-out infinite; }
    .kbody { animation: bob .4s ease-in-out infinite; }
    .l1 { animation: legA .4s ease-in-out infinite; }
    .l2 { animation: legB .4s ease-in-out infinite; }
    .wing { animation: flap .9s ease-in-out infinite; }
    .flame { animation: flame .35s ease-in-out infinite; }
    .hp { animation: hp 7s linear infinite; transform-box: fill-box; transform-origin: right center; }
    .blink { animation: blink 1s steps(1) infinite; }
    .cloud { animation: cloud 24s linear infinite; }
    .star { animation: twinkle 2s ease-in-out infinite; }
    .t { font-family: 'Courier New', monospace; font-weight: bold; }
  </style>

  <rect width="800" height="220" fill="#0d1117"/>

  <g fill="#ffffff">
    <rect class="star" x="60" y="48" width="3" height="3"/>
    <rect class="star" x="190" y="100" width="3" height="3" style="animation-delay:.6s"/>
    <rect class="star" x="300" y="40" width="3" height="3" style="animation-delay:1.1s"/>
    <rect class="star" x="690" y="70" width="3" height="3" style="animation-delay:.3s"/>
    <rect class="star" x="760" y="110" width="3" height="3" style="animation-delay:1.5s"/>
  </g>

  <g class="cloud" fill="#21262d">
    <g transform="translate(900,96)"><rect x="0" y="8" width="60" height="12"/><rect x="10" y="0" width="30" height="12"/></g>
    <g transform="translate(1500,120)"><rect x="0" y="8" width="48" height="10"/><rect x="8" y="0" width="24" height="10"/></g>
  </g>

  <g class="hills" fill="#161b22">
    <polygon points="0,180 50,140 100,180"/><polygon points="200,180 260,130 320,180"/>
    <polygon points="400,180 450,145 500,180"/><polygon points="600,180 660,135 720,180"/>
    <polygon points="800,180 850,140 900,180"/><polygon points="1000,180 1060,130 1120,180"/>
  </g>

  <text x="16" y="20" class="t" font-size="11" fill="#58a6ff">PLAYER ONE</text>
  <rect x="16" y="26" width="140" height="8" fill="#21262d" stroke="#30363d"/>
  <rect x="16" y="26" width="140" height="8" fill="#3fb950"/>
  <text x="784" y="20" text-anchor="end" class="t" font-size="11" fill="#f85149">DRAGÃO</text>
  <rect x="644" y="26" width="140" height="8" fill="#21262d" stroke="#30363d"/>
  <rect class="hp" x="644" y="26" width="140" height="8" fill="#f85149"/>

  <text x="400" y="66" text-anchor="middle" class="t" font-size="26" fill="#58a6ff">KAIKE ALVES PRAXEDES</text>
  <text x="400" y="88" text-anchor="middle" class="t" font-size="14" fill="#8b949e">PLAYER ONE  |  ADS  |  DADOS</text>

  <rect x="0" y="180" width="800" height="40" fill="#2d6a4f"/>
  <rect x="0" y="180" width="800" height="6" fill="#40916c"/>
  <g class="scroll" fill="#1b4332">
    <rect x="20" y="196" width="40" height="6"/><rect x="120" y="206" width="40" height="6"/>
    <rect x="220" y="196" width="40" height="6"/><rect x="320" y="206" width="40" height="6"/>
    <rect x="420" y="196" width="40" height="6"/><rect x="520" y="206" width="40" height="6"/>
    <rect x="620" y="196" width="40" height="6"/><rect x="720" y="206" width="40" height="6"/>
    <rect x="820" y="196" width="40" height="6"/><rect x="920" y="206" width="40" height="6"/>
  </g>
  <text x="16" y="210" class="t blink" font-size="13" fill="#f2cc60">- PRESS START -</text>

  <g transform="translate(470,110)">
    <g class="recoil">
      <polygon points="138,40 175,34 205,12 210,38 180,62 138,62" fill="#1a7f37"/>
      <g transform="translate(96,36)"><g class="wing"><polygon points="0,0 -32,-48 8,-34 22,-66 40,-34 72,-44 52,0" fill="#3fb950"/></g></g>
      <rect x="40" y="36" width="100" height="32" fill="#2ea043"/>
      <rect x="44" y="58" width="92" height="10" fill="#d4a72c"/>
      <polygon points="56,36 62,26 68,36" fill="#1a7f37"/>
      <polygon points="80,36 86,26 92,36" fill="#1a7f37"/>
      <polygon points="104,36 110,26 116,36" fill="#1a7f37"/>
      <rect x="56" y="66" width="14" height="8" fill="#1a7f37"/>
      <rect x="112" y="66" width="14" height="8" fill="#1a7f37"/>
      <rect x="18" y="18" width="26" height="22" fill="#2ea043"/>
      <rect x="-12" y="10" width="40" height="22" fill="#2ea043"/>
      <rect x="-22" y="16" width="12" height="12" fill="#2ea043"/>
      <rect x="-20" y="28" width="30" height="5" fill="#1a7f37"/>
      <rect x="-20" y="18" width="3" height="3" fill="#0d1117"/>
      <rect x="8" y="14" width="6" height="5" fill="#f85149"/>
      <polygon points="8,10 14,-2 20,10" fill="#c9d1d9"/>
      <polygon points="20,10 28,-1 32,10" fill="#c9d1d9"/>
    </g>
  </g>

  <g transform="translate(446,131) rotate(25)">
    <g class="flame">
      <polygon points="0,0 -35,-12 -70,-6 -98,4 -70,14 -35,14" fill="#f0883e"/>
      <polygon points="0,1 -30,-6 -58,0 -78,5 -58,10 -30,10" fill="#f2cc60"/>
    </g>
  </g>

  <polygon class="spark" points="452,128 455,135 462,138 455,141 452,148 449,141 442,138 449,135" fill="#fff7c2" stroke="#f2cc60"/>

  <g transform="translate(385,134)">
    <g class="l1"><rect x="8" y="32" width="6" height="10" fill="#1f6feb"/><rect x="6" y="42" width="9" height="4" fill="#3d2b1f"/></g>
    <g class="l2"><rect x="18" y="32" width="6" height="10" fill="#1f6feb"/><rect x="16" y="42" width="9" height="4" fill="#3d2b1f"/></g>
    <g class="kbody">
      <rect x="14" y="-6" width="6" height="6" fill="#f85149"/>
      <rect x="8" y="0" width="16" height="16" fill="#8b949e"/>
      <rect x="16" y="6" width="8" height="3" fill="#0d1117"/>
      <rect x="6" y="16" width="20" height="16" fill="#1f6feb"/>
      <rect x="6" y="28" width="20" height="3" fill="#f2cc60"/>
      <rect x="-2" y="18" width="8" height="14" fill="#f2cc60" stroke="#b08800" stroke-width="1.5"/>
      <g transform="translate(26,22)">
        <g class="slash">
          <rect x="0" y="-3" width="10" height="6" fill="#f5c28b"/>
          <rect x="8" y="-38" width="4" height="34" fill="#c9d1d9"/>
          <rect x="3" y="-6" width="14" height="3" fill="#f2cc60"/>
        </g>
      </g>
    </g>
  </g>
</svg>
